<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2d6a4f" />
  <title>P'tits Dîners — Dîners familiaux</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f2;
      --surface: #ffffff;
      --surface-alt: #edf3ed;
      --text: #18231d;
      --muted: #5c6c63;
      --primary: #2d6a4f;
      --primary-soft: #e4f3eb;
      --primary-ink: #ffffff;
      --accent: #e07a3f;
      --border: #dce4dc;
      --danger: #c0392b;
      --ok-bg: #e4f4eb;
      --ok-text: #195c39;
      --shadow: 0 4px 14px rgba(24, 35, 29, 0.05);
    }

    [data-theme="dark"] {
      --bg: #101512;
      --surface: #19211c;
      --surface-alt: #222d26;
      --text: #eef3ef;
      --muted: #9fb0a6;
      --primary: #40916c;
      --primary-soft: #1a3829;
      --primary-ink: #09120d;
      --accent: #f08a4b;
      --border: #2a382f;
      --danger: #e56b5e;
      --ok-bg: #173626;
      --ok-text: #8ce3b3;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 86px;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 13px;
      background: var(--primary-soft); display: grid; place-items: center; font-size: 22px;
    }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.2px; }
    .brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

    .theme-btn {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .seasons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 10px 12px;
      max-width: 780px;
      margin: 0 auto;
    }

    .season-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 11px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .season-btn.active {
      background: var(--primary);
      color: var(--primary-ink);
      border-color: var(--primary);
    }

    .banner {
      max-width: 780px;
      margin: 0 auto 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--ok-bg);
      color: var(--ok-text);
      font-size: 13px;
      font-weight: 600;
    }
    .banner.err { background: #fdecea; color: var(--danger); }
    .hidden { display: none !important; }

    main { max-width: 780px; margin: 0 auto; padding: 0 12px; }
    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .hero {
      background: linear-gradient(135deg, var(--primary), #1b4935);
      color: #ffffff;
      border: none;
    }
    .hero .muted { color: rgba(255, 255, 255, 0.88); }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .wrap { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-soft);
      color: var(--primary);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.2px;
      padding: 5px 12px;
      border-radius: 10px;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    .btn-primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
    .btn-accent { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }

    select, input {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .select-sm { padding: 5px 8px; font-size: 12px; border-radius: 8px; font-weight: 600; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .badge-ok { background: var(--ok-bg); color: var(--ok-text); border-color: transparent; }
    .badge-manual { background: #fff3e6; color: #b45309; border-color: #fed7aa; }
    [data-theme="dark"] .badge-manual { background: #3a2612; color: #fdba74; border-color: #7c3f14; }

    .item-title { margin: 4px 0 6px; font-size: 15.5px; font-weight: 700; }
    .muted { color: var(--muted); font-size: 12px; }

    .list-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-row:last-child { border-bottom: none; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
    }
    .modal-box {
      width: 100%;
      max-width: 580px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--surface);
      color: var(--text);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 4px env(safe-area-inset-bottom);
    }
    .nav-btn {
      border: 0; background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; padding: 4px; cursor: pointer;
    }
    .nav-btn.active { color: var(--primary); font-weight: 800; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">🥦</div>
      <div>
        <h1>P'tits Dîners</h1>
        <p>4 pers. (2 ad. + 3 &amp; 5 ans) • Légumes &amp; saison</p>
      </div>
    </div>
    <button type="button" id="themeBtn" class="theme-btn" aria-label="Changer le thème">🌙</button>
  </header>

  <div class="seasons" role="group" aria-label="Saisons">
    <button type="button" class="season-btn" data-season="Printemps">🌸 Printemps</button>
    <button type="button" class="season-btn" data-season="Été">☀️ Été</button>
    <button type="button" class="season-btn" data-season="Automne">🍂 Automne</button>
    <button type="button" class="season-btn" data-season="Hiver">❄️ Hiver</button>
  </div>

  <div id="banner" class="banner hidden" role="status"></div>

  <main>
    <section id="tab-planning" class="panel active"></section>
    <section id="tab-recipes" class="panel"></section>
    <section id="tab-stock" class="panel"></section>
    <section id="tab-history" class="panel"></section>
  </main>

  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="row" style="border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:10px;">
        <strong id="modalTitle" style="font-size:16px;">Fiche recette</strong>
        <button type="button" id="closeModal" class="btn btn-sm">✕</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <button type="button" class="nav-btn active" data-tab="planning">📅<span>Planning</span></button>
    <button type="button" class="nav-btn" data-tab="recipes">🍲<span>Recettes</span></button>
    <button type="button" class="nav-btn" data-tab="stock">🛒<span>Stock &amp; Courses</span></button>
    <button type="button" class="nav-btn" data-tab="history">📋<span>Suivi</span></button>
  </nav>

  <script>
    (function () {
      const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
      const DURATIONS = [
        { id: 'auto', label: 'Auto (5-25 min)', min: 5, max: 25 },
        { id: '5-15', label: '5-15 min', min: 5, max: 15 },
        { id: '15-30', label: '15-30 min', min: 15, max: 30 },
        { id: '30-60', label: '30 min-1 h', min: 30, max: 60 },
        { id: '60+', label: '+1 h', min: 60, max: 240 }
      ];

      const INITIAL_STOCK = [
        { name: 'Carottes', qty: 600, unit: 'g', cat: 'legume', urgent: true },
        { name: 'Courgettes', qty: 500, unit: 'g', cat: 'legume', urgent: false },
        { name: 'Poireaux', qty: 3, unit: 'pièces', cat: 'legume', urgent: true },
        { name: 'Épinards frais', qty: 300, unit: 'g', cat: 'legume', urgent: false },
        { name: 'Brocoli', qty: 400, unit: 'g', cat: 'legume', urgent: false },
        { name: 'Potimarron', qty: 600, unit: 'g', cat: 'legume', urgent: false },
        { name: 'Tomates', qty: 500, unit: 'g', cat: 'legume', urgent: false },
        { name: 'Blanc de poulet', qty: 500, unit: 'g', cat: 'viande', urgent: false },
        { name: 'Pavés de saumon', qty: 4, unit: 'pièces', cat: 'viande', urgent: false },
        { name: 'Œufs', qty: 10, unit: 'pièces', cat: 'frais', urgent: false },
        { name: 'Emmental râpé', qty: 200, unit: 'g', cat: 'frais', urgent: false },
        { name: 'Crème légère', qty: 200, unit: 'ml', cat: 'frais', urgent: false },
        { name: 'Pâtes complètes', qty: 900, unit: 'g', cat: 'epicerie', urgent: false },
        { name: 'Riz basmati', qty: 900, unit: 'g', cat: 'epicerie', urgent: false },
        { name: 'Lentilles corail', qty: 450, unit: 'g', cat: 'epicerie', urgent: false },
        { name: 'Pommes de terre', qty: 1200, unit: 'g', cat: 'legume', urgent: false }
      ];

      const RECIPES = [
        { id: 'r1', title: 'Poêlée douce poulet, poireaux & carottes', season: 'Automne', prepTime: 18, veggies: ['Poireaux', 'Carottes'],
          ingredients: [{ name: 'Blanc de poulet', qty: 420, unit: 'g' }, { name: 'Poireaux', qty: 2, unit: 'pièces' }, { name: 'Carottes', qty: 250, unit: 'g' }, { name: 'Crème légère', qty: 120, unit: 'ml' }, { name: 'Riz basmati', qty: 240, unit: 'g' }],
          steps: ['Cuire le riz basmati.', 'Faire revenir les dés de poulet, poireaux et carottes en petits morceaux.', 'Ajouter la crème légère en fin de cuisson et servir avec le riz.'] },
        { id: 'r2', title: 'Omelette moelleuse aux épinards & emmental', season: 'Printemps', prepTime: 12, veggies: ['Épinards frais'],
          ingredients: [{ name: 'Œufs', qty: 6, unit: 'pièces' }, { name: 'Épinards frais', qty: 220, unit: 'g' }, { name: 'Emmental râpé', qty: 80, unit: 'g' }, { name: 'Pommes de terre', qty: 350, unit: 'g' }],
          steps: ['Faire tomber les épinards à la poêle.', 'Verser les œufs battus et l’emmental, cuire doucement.', 'Servir avec des pommes de terre vapeur.'] },
        { id: 'r3', title: 'Pâtes complètes courgettes fondantes & saumon', season: 'Été', prepTime: 16, veggies: ['Courgettes'],
          ingredients: [{ name: 'Pâtes complètes', qty: 300, unit: 'g' }, { name: 'Courgettes', qty: 350, unit: 'g' }, { name: 'Pavés de saumon', qty: 3, unit: 'pièces' }, { name: 'Crème légère', qty: 100, unit: 'ml' }],
          steps: ['Cuire les pâtes complètes.', 'Faire revenir les courgettes en petits dés puis ajouter le saumon émietté et la crème.', 'Mélanger le tout aux pâtes.'] },
        { id: 'r4', title: 'Velouté potimarron, carottes & mouillettes', season: 'Hiver', prepTime: 22, veggies: ['Potimarron', 'Carottes'],
          ingredients: [{ name: 'Potimarron', qty: 450, unit: 'g' }, { name: 'Carottes', qty: 250, unit: 'g' }, { name: 'Pommes de terre', qty: 250, unit: 'g' }, { name: 'Emmental râpé', qty: 80, unit: 'g' }],
          steps: ['Couper les légumes et les cuire 15 min dans l’eau.', 'Mixer finement et servir avec l’emmental.'] },
        { id: 'r5', title: 'Dahl familial lentilles corail, carottes & tomates', season: 'Automne', prepTime: 20, veggies: ['Carottes', 'Tomates'],
          ingredients: [{ name: 'Lentilles corail', qty: 220, unit: 'g' }, { name: 'Carottes', qty: 220, unit: 'g' }, { name: 'Tomates', qty: 300, unit: 'g' }, { name: 'Riz basmati', qty: 200, unit: 'g' }],
          steps: ['Rincer les lentilles et râper les carottes.', 'Mijoter 15 min avec les tomates et l’eau, puis servir avec le riz.'] },
        { id: 'r6', title: 'Poêlée rapide brocoli, œufs & pommes de terre', season: 'Printemps', prepTime: 14, veggies: ['Brocoli'],
          ingredients: [{ name: 'Brocoli', qty: 300, unit: 'g' }, { name: 'Pommes de terre', qty: 350, unit: 'g' }, { name: 'Œufs', qty: 6, unit: 'pièces' }],
          steps: ['Cuire les petits fleurets de brocoli et les pommes de terre.', 'Ajouter les œufs brouillés et mélanger.'] },
        { id: 'r7', title: 'Tian doré tomates, courgettes & œufs au four', season: 'Été', prepTime: 38, veggies: ['Tomates', 'Courgettes'],
          ingredients: [{ name: 'Tomates', qty: 400, unit: 'g' }, { name: 'Courgettes', qty: 350, unit: 'g' }, { name: 'Œufs', qty: 6, unit: 'pièces' }, { name: 'Emmental râpé', qty: 80, unit: 'g' }],
          steps: ['Disposer tomates et courgettes en rondelles dans un plat et enfourner 22 min à 190 °C.', 'Casser les œufs, ajouter l’emmental et poursuivre 10 min.'] },
        { id: 'r8', title: 'Gratin fondant brocoli, pommes de terre & poulet', season: 'Hiver', prepTime: 45, veggies: ['Brocoli'],
          ingredients: [{ name: 'Brocoli', qty: 350, unit: 'g' }, { name: 'Pommes de terre', qty: 500, unit: 'g' }, { name: 'Blanc de poulet', qty: 350, unit: 'g' }, { name: 'Crème légère', qty: 150, unit: 'ml' }, { name: 'Emmental râpé', qty: 100, unit: 'g' }],
          steps: ['Précuire légumes et poulet.', 'Napper de crème et d’emmental puis gratiner 25 min à 190 °C.'] },
        { id: 'r9', title: 'Mijoté maison poulet, carottes & poireaux', season: 'Automne', prepTime: 70, veggies: ['Carottes', 'Poireaux'],
          ingredients: [{ name: 'Blanc de poulet', qty: 500, unit: 'g' }, { name: 'Carottes', qty: 350, unit: 'g' }, { name: 'Poireaux', qty: 2, unit: 'pièces' }, { name: 'Pommes de terre', qty: 400, unit: 'g' }, { name: 'Crème légère', qty: 120, unit: 'ml' }],
          steps: ['Dorer les morceaux de poulet et les légumes.', 'Laisser mijoter à couvert 55 min à feu doux puis lier à la crème.'] },
        { id: 'r10', title: 'Cocotte longue cuisson saumon, potimarron & riz', season: 'Hiver', prepTime: 65, veggies: ['Potimarron'],
          ingredients: [{ name: 'Pavés de saumon', qty: 4, unit: 'pièces' }, { name: 'Potimarron', qty: 500, unit: 'g' }, { name: 'Riz basmati', qty: 240, unit: 'g' }, { name: 'Crème légère', qty: 120, unit: 'ml' }],
          steps: ['Cuire doucement le potimarron et le riz.', 'Ajouter le saumon et la crème en fin de cuisson pour un plat très fondant.'] }
      ];

      const STORAGE_KEY = 'ptits_diners_solo_v4';
      const state = {
        theme: 'light',
        tab: 'planning',
        season: 'Automne',
        stock: INITIAL_STOCK.map(function (x) { return Object.assign({}, x); }),
        plan: [],
        history: [],
        includeShoppingPdf: true
      };

      function inferCat(name) {
        const n = (name || '').toLowerCase();
        if (/carotte|courgette|poireau|epinard|épinard|brocoli|potimarron|tomate|champignon|pois|haricot|salade|chou|pomme de terre/.test(n)) return 'legume';
        if (/pomme|banane|poire|fraise|clémentine|orange|kiwi|fruit/.test(n)) return 'fruit';
        if (/poulet|saumon|jambon|dinde|boeuf|bœuf|poisson|thon|cabillaud/.test(n)) return 'viande';
        if (/oeuf|œuf|lait|crème|creme|fromage|emmental|yaourt|beurre/.test(n)) return 'frais';
        return 'epicerie';
      }

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
      }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (parsed.theme) state.theme = parsed.theme;
          if (parsed.tab) state.tab = parsed.tab;
          if (parsed.season) state.season = parsed.season;
          if (Array.isArray(parsed.stock) && parsed.stock.length) state.stock = parsed.stock;
          if (Array.isArray(parsed.plan) && parsed.plan.length === 7) {
            state.plan = parsed.plan.map(function (p, idx) {
              return {
                day: DAYS[idx],
                recipeId: p && p.recipeId ? p.recipeId : RECIPES[idx % RECIPES.length].id,
                slotId: p && p.slotId ? p.slotId : 'auto',
                x2: Boolean(p && p.x2),
                cooked: Boolean(p && p.cooked),
                manual: Boolean(p && p.manual),
                hid: p && p.hid ? p.hid : undefined
              };
            });
          }
          if (Array.isArray(parsed.history)) state.history = parsed.history;
          if (typeof parsed.includeShoppingPdf === 'boolean') state.includeShoppingPdf = parsed.includeShoppingPdf;
        } catch (_) {}
      }

      function banner(msg, isErr) {
        const el = document.getElementById('banner');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden', 'err');
        if (isErr) el.classList.add('err');
        clearTimeout(banner._t);
        banner._t = setTimeout(function () { el.classList.add('hidden'); }, 4000);
      }

      function applyTheme() {
        document.documentElement.setAttribute('data-theme', state.theme);
        const btn = document.getElementById('themeBtn');
        if (btn) btn.textContent = state.theme === 'dark' ? '☀️' : '🌙';
      }

      function matchesSlot(prepTime, slotId) {
        const slot = DURATIONS.find(function (d) { return d.id === slotId; }) || DURATIONS[0];
        if (slot.id === '60+') return prepTime >= 60;
        return prepTime >= slot.min && prepTime <= slot.max;
      }

      // Calcule un score de compatibilité avec la durée, la saison et le stock disponible
      function scoreRecipe(r, slotId, virtualStock, usedIds, previousIds, strictSlot) {
        const slotOk = matchesSlot(r.prepTime, slotId);
        if (strictSlot && !slotOk) return -9999;

        let score = 0;
        if (slotOk) {
          score += 60;
        } else {
          // Proximité de durée si aucune recette n'entre exactement dans le créneau demandé
          const slot = DURATIONS.find(function (d) { return d.id === slotId; }) || DURATIONS[0];
          const targetMid = slot.id === '60+' ? 70 : (slot.min + slot.max) / 2;
          score -= Math.abs(r.prepTime - targetMid) * 1.2;
        }

        if (r.season === state.season) score += 35;

        // Disponibilité réelle des ingrédients dans le stock virtuel (mis à jour au fil de la semaine)
        let matchedCount = 0;
        let fullCoverage = true;
        r.ingredients.forEach(function (req) {
          const st = virtualStock.find(function (s) { return s.name.toLowerCase() === req.name.toLowerCase(); });
          const avail = st ? st.qty : 0;
          if (avail >= req.qty && req.qty > 0) {
            matchedCount += 1;
            score += 12;
            if (st && st.urgent) score += 18;
          } else if (avail > 0) {
            matchedCount += 0.5;
            score += 5;
            fullCoverage = false;
          } else {
            fullCoverage = false;
          }
        });
        if (fullCoverage) score += 15;
        score += matchedCount * 2;

        // Évite les doublons dans la même semaine et favorise la rotation par rapport au planning précédent
        if (usedIds.has(r.id)) score -= 80;
        if (previousIds.indexOf(r.id) === -1) score += 12;

        score += Math.random() * 10;
        return score;
      }

      function consumeVirtualStock(virtualStock, recipeId, mult) {
        const r = RECIPES.find(function (x) { return x.id === recipeId; });
        if (!r) return;
        r.ingredients.forEach(function (req) {
          const st = virtualStock.find(function (s) { return s.name.toLowerCase() === req.name.toLowerCase(); });
          if (st) st.qty = Math.max(0, st.qty - req.qty * mult);
        });
      }

      function pickRecipeFor(dayIdx, slotId, virtualStock, usedIds, previousIds) {
        // 1. Essayer d'abord les recettes correspondant exactement à la durée définie
        let pool = RECIPES.filter(function (r) { return matchesSlot(r.prepTime, slotId) && !usedIds.has(r.id); });
        // 2. Sinon, n'importe quelle recette correspondant à la durée (même déjà utilisée dans la semaine)
        if (!pool.length) {
          pool = RECIPES.filter(function (r) { return matchesSlot(r.prepTime, slotId); });
        }
        // 3. Sinon, n'importe quelle recette non encore utilisée cette semaine
        if (!pool.length) {
          pool = RECIPES.filter(function (r) { return !usedIds.has(r.id); });
        }
        // 4. Repli final sur tout le catalogue
        if (!pool.length) {
          pool = RECIPES.slice();
        }

        const ranked = pool
          .map(function (r) {
            return { r: r, score: scoreRecipe(r, slotId, virtualStock, usedIds, previousIds, false) };
          })
          .sort(function (a, b) { return b.score - a.score; });

        return (ranked[0] && ranked[0].r) || RECIPES[dayIdx % RECIPES.length];
      }

      // Génère tous les repas de la semaine sauf ceux choisis manuellement par l'utilisateur
      function generateWeek(forceAll) {
        const previousIds = (state.plan || []).map(function (p) { return p && p.recipeId; }).filter(Boolean);
        const virtualStock = state.stock.map(function (s) { return Object.assign({}, s); });
        const usedIds = new Set();
        let keptManualCount = 0;
        let generatedCount = 0;

        const nextPlan = [];
        for (let idx = 0; idx < DAYS.length; idx++) {
          const day = DAYS[idx];
          const prev = (state.plan && state.plan[idx]) || {
            day: day,
            recipeId: RECIPES[idx % RECIPES.length].id,
            slotId: 'auto',
            x2: false,
            cooked: false,
            manual: false
          };
          const slotId = prev.slotId || 'auto';
          const mult = prev.x2 ? 2 : 1;

          // Respect strict des choix manuels de l'utilisateur
          if (prev.manual && prev.recipeId) {
            usedIds.add(prev.recipeId);
            consumeVirtualStock(virtualStock, prev.recipeId, mult);
            keptManualCount += 1;
            nextPlan.push({
              day: day,
              recipeId: prev.recipeId,
              slotId: slotId,
              x2: Boolean(prev.x2),
              cooked: Boolean(prev.cooked),
              manual: true,
              hid: prev.hid
            });
            continue;
          }

          const chosen = pickRecipeFor(idx, slotId, virtualStock, usedIds, previousIds);
          usedIds.add(chosen.id);
          consumeVirtualStock(virtualStock, chosen.id, mult);
          generatedCount += 1;

          nextPlan.push({
            day: day,
            recipeId: chosen.id,
            slotId: slotId,
            x2: Boolean(prev.x2),
            cooked: false,
            manual: false
          });
        }

        state.plan = nextPlan;
        save();
        render();

        if (keptManualCount > 0) {
          banner(`${generatedCount} repas générés (${state.season}) • ${keptManualCount} choix manuel(s) conservé(s).`);
        } else {
          banner(`Semaine complète générée (${state.season}) selon vos durées et votre stock.`);
        }
      }

      function shoppingList() {
        const needed = {};
        state.plan.forEach(function (slot) {
          if (!slot || slot.cooked) return;
          const r = RECIPES.find(function (item) { return item.id === slot.recipeId; });
          if (!r) return;
          const mult = slot.x2 ? 2 : 1;
          r.ingredients.forEach(function (ing) {
            const k = ing.name.toLowerCase();
            if (!needed[k]) needed[k] = { name: ing.name, qty: 0, unit: ing.unit, cat: inferCat(ing.name) };
            needed[k].qty += ing.qty * mult;
          });
        });

        const out = [];
        Object.values(needed).forEach(function (req) {
          const st = state.stock.find(function (s) { return s.name.toLowerCase() === req.name.toLowerCase(); });
          const have = st ? st.qty : 0;
          if (req.qty > have) {
            out.push({ name: req.name, missing: Math.round((req.qty - have) * 10) / 10, unit: req.unit, cat: req.cat });
          }
        });
        return out;
      }

      function markCooked(dayIdx) {
        const slot = state.plan[dayIdx];
        const r = slot && RECIPES.find(function (x) { return x.id === slot.recipeId; });
        if (!slot || !r || slot.cooked) return;
        const mult = slot.x2 ? 2 : 1;
        r.ingredients.forEach(function (req) {
          const st = state.stock.find(function (s) { return s.name.toLowerCase() === req.name.toLowerCase(); });
          if (st) st.qty = Math.max(0, Math.round((st.qty - req.qty * mult) * 10) / 10);
        });
        const hid = 'h_' + Date.now() + '_' + dayIdx;
        slot.cooked = true;
        slot.hid = hid;
        state.history.unshift({ id: hid, dayIdx: dayIdx, day: slot.day, title: r.title, recipeId: r.id, x2: slot.x2, date: new Date().toLocaleDateString('fr-FR') });
        save();
        render();
        banner(`« ${r.title} » marqué réalisé.`);
      }

      function unmarkCooked(hid, fallbackDayIdx) {
        const idx = state.history.findIndex(function (h) { return h.id === hid; });
        const entry = idx !== -1 ? state.history[idx] : null;
        const dIdx = entry ? entry.dayIdx : fallbackDayIdx;
        const slot = typeof dIdx === 'number' ? state.plan[dIdx] : null;
        const rId = (entry && entry.recipeId) || (slot && slot.recipeId);
        const mult = ((entry ? entry.x2 : slot && slot.x2) ? 2 : 1);
        const r = RECIPES.find(function (x) { return x.id === rId; });

        if (r) {
          r.ingredients.forEach(function (req) {
            let st = state.stock.find(function (s) { return s.name.toLowerCase() === req.name.toLowerCase(); });
            if (!st) {
              st = { name: req.name, qty: 0, unit: req.unit, cat: inferCat(req.name), urgent: false };
              state.stock.push(st);
            }
            st.qty = Math.round((st.qty + req.qty * mult) * 10) / 10;
          });
        }
        if (idx !== -1) state.history.splice(idx, 1);
        if (slot) { slot.cooked = false; delete slot.hid; }
        save();
        render();
        banner('Statut « Réalisé » retiré et stock recrédité.');
      }

          doc.setFillColor(45, 106, 79);

          doc.setFillColor(82, 183, 136);
          doc.circle(cx + 0.8, cy - 0.3, 1.2, 'F');
          doc.setDrawColor(27, 67, 50);
          doc.setLineWidth(0.35);
          doc.line(cx, cy + 1.8, cx, cy - 0.5);

          doc.setFillColor(192, 57, 43);
          doc.roundedRect(cx - 2.0, cy - 1.3, 4.0, 2.6, 1.1, 1.1, 'F');
          doc.setFillColor(255, 235, 232);
          doc.circle(cx - 0.7, cy, 0.5, 'F');
        } else if (type === 'frais') {
          doc.setFillColor(41, 128, 185);
          doc.triangle(cx, cy - 1.8, cx - 1.7, cy + 1.5, cx + 1.7, cy + 1.5, 'F');
          doc.setFillColor(255, 255, 255);
          doc.circle(cx, cy + 0.4, 0.45, 'F');
        } else if (type === 'fruit') {
          doc.setFillColor(224, 122, 63);
          doc.circle(cx, cy + 0.2, 1.7, 'F');
          doc.setFillColor(45, 106, 79);
          doc.ellipse(cx + 0.6, cy - 1.6, 0.9, 0.45, 'F');
        } else if (type === 'epicerie') {
          doc.setFillColor(180, 125, 62);
          doc.roundedRect(cx - 1.6, cy - 1.6, 3.2, 3.2, 0.6, 0.6, 'F');
          doc.setDrawColor(255, 245, 230);
          doc.setLineWidth(0.3);
          doc.line(cx - 1.0, cy - 0.4, cx + 1.0, cy - 0.4);
        } else if (type === 'basket') {
          doc.setDrawColor(255, 255, 255);
          doc.setLineWidth(0.45);
          doc.roundedRect(cx - 2.4, cy - 0.8, 4.8, 2.8, 0.5, 0.5, 'S');

          doc.line(cx + 1.4, cy - 0.8, cx + 0.6, cy - 2.3);

          doc.setDrawColor(255, 255, 255);
          doc.setLineWidth(0.45);
          doc.circle(cx, cy, 2.8, 'S');
          doc.circle(cx, cy, 1.8, 'S');
        }
        doc.restoreGraphicsState();
      }

      function exportPdf() {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          return banner('Librairie PDF indisponible hors ligne.', true);
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: 'mm', format: 'a4' });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const m = 13;
        const w = pageW - m * 2;
        let y = 14;

        const seasonThemes = {
          Printemps: { main: [45, 134, 89], light: [236, 248, 241], accent: [230, 126, 34] },
          Été: { main: [33, 131, 128], light: [235, 247, 246], accent: [224, 122, 63] },
          Automne: { main: [45, 106, 79], light: [238, 245, 240], accent: [211, 107, 48] },
          Hiver: { main: [39, 93, 122], light: [236, 243, 248], accent: [214, 118, 56] }
        };
        const pal = seasonThemes[state.season] || seasonThemes.Automne;

        const ensure = function (need) {
          if (y + need > pageH - 16) {
            doc.addPage();
            y = 14;
          }
        };

        doc.setFillColor(...pal.main);
        doc.roundedRect(m, y, w, 21, 3.5, 3.5, 'F');
        drawVectorIcon(doc, 'plate', m + 7.5, y + 10.5);
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(14.5);
        doc.text("P'tits Dîners • Menu de la semaine", m + 14, y + 8.5);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9.5);
        doc.text(`Saison : ${state.season}  |  Foyer : 4 personnes (2 adultes + enfants 3 & 5 ans)`, m + 14, y + 15);
        y += 26;

        state.plan.forEach(function (slot) {
          const r = RECIPES.find(function (x) { return x.id === slot.recipeId; });
          if (!r) return;
          const mult = slot.x2 ? 2 : 1;

          const ingList = r.ingredients.map(function (i) { return `${i.name} (${Math.round(i.qty * mult)} ${i.unit})`; }).join('  •  ');
          const stepList = r.steps.map(function (s, idx) { return `${idx + 1}. ${s}`; }).join('  ');

          doc.setFontSize(8.8);
          const lIng = doc.splitTextToSize(ingList, w - 10);
          const lStep = doc.splitTextToSize(stepList, w - 10);

          const headerBandH = 8.5;
          const metaBandH = 6.5;
          const ingH = lIng.length * 4.1 + 2;
          const stepH = lStep.length * 4.1 + 3;
          const boxH = headerBandH + metaBandH + ingH + stepH + 3.5;

          ensure(boxH + 4);

          doc.setFillColor(251, 252, 251);
          doc.setDrawColor(214, 224, 217);
          doc.setLineWidth(0.3);
          doc.roundedRect(m, y, w, boxH, 2.5, 2.5, 'FD');

          doc.setFillColor(...pal.light);
          doc.roundedRect(m, y, w, headerBandH, 2.5, 2.5, 'F');
          doc.rect(m, y + headerBandH - 2, w, 2, 'F');

          doc.setFillColor(...pal.main);
          doc.roundedRect(m + 3, y + 1.6, 24, 5.2, 1.5, 1.5, 'F');
          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8.2);
          doc.text(slot.day.toUpperCase(), m + 15, y + 5.1, { align: 'center' });

          doc.setTextColor(24, 35, 29);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(9.8);
          const wrappedTitle = doc.splitTextToSize(`${r.title}${slot.x2 ? '  [x2]' : ''}`, w - 31);
          doc.text(wrappedTitle[0], m + 30, y + 5.2);

          const metaY = y + headerBandH + 4.3;
          drawVectorIcon(doc, 'clock', m + 5.2, metaY - 1.1);
          doc.setTextColor(85, 100, 91);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8.2);
          doc.text(`${r.prepTime} min`, m + 9, metaY);

          drawVectorIcon(doc, 'veggie', m + 27, metaY - 1.1);
          doc.setFont('helvetica', 'normal');
          doc.text(`Légumes : ${r.veggies.join(', ')}  •  Portions : ${4 * mult} pers.`, m + 31, metaY);

          doc.setDrawColor(232, 238, 234);
          doc.line(m + 3, metaY + 2, m + w - 3, metaY + 2);

          let curY = metaY + 6.2;
          doc.setTextColor(...pal.main);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8.5);
          doc.text('Ingrédients :', m + 4, curY);
          doc.setTextColor(35, 45, 40);
          doc.setFont('helvetica', 'normal');
          doc.text(lIng, m + 4, curY + 4.1);
          curY += ingH + 3.2;

          doc.setTextColor(...pal.accent);
          doc.setFont('helvetica', 'bold');
          doc.text('Préparation :', m + 4, curY);
          doc.setTextColor(45, 55, 50);
          doc.setFont('helvetica', 'normal');
          doc.text(lStep, m + 4, curY + 4.1);

          y += boxH + 3.8;
        });

        const shop = shoppingList();
        if (state.includeShoppingPdf && shop.length) {
          ensure(26);
          y += 2;
          doc.setFillColor(...pal.accent);
          doc.roundedRect(m, y, w, 10.5, 2.5, 2.5, 'F');
          drawVectorIcon(doc, 'basket', m + 6.5, y + 5.2);
          doc.setTextColor(255, 255, 255);
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(11);
          doc.text(`Liste de courses complémentaire (${shop.length} articles)`, m + 12, y + 6.9);
          y += 14.5;

          const colW = (w - 4) / 2;
          for (let i = 0; i < shop.length; i += 2) {
            ensure(8.5);
            [shop[i], shop[i + 1]].forEach(function (item, colIdx) {
              if (!item) return;
              const x0 = m + colIdx * (colW + 4);
              doc.setFillColor(250, 251, 250);
              doc.setDrawColor(220, 228, 222);
              doc.roundedRect(x0, y - 4.5, colW, 7, 1.5, 1.5, 'FD');

              doc.setDrawColor(140, 155, 146);
              doc.rect(x0 + 2.5, y - 2.6, 3.2, 3.2, 'S');
              drawVectorIcon(doc, item.cat || 'epicerie', x0 + 9.2, y - 1.0);

              doc.setTextColor(24, 35, 29);
              doc.setFont('helvetica', 'bold');
              doc.setFontSize(8.8);
              doc.text(item.name, x0 + 13.5, y);

              doc.setTextColor(...pal.main);
              doc.setFont('helvetica', 'bold');
              doc.text(`${item.missing} ${item.unit}`, x0 + colW - 3, y, { align: 'right' });
            });
            y += 8.2;
          }
        }

        const totalPages = doc.internal.getNumberOfPages();
        for (let p = 1; p <= totalPages; p++) {
          doc.setPage(p);
          doc.setDrawColor(225, 232, 227);
          doc.line(m, pageH - 11, m + w, pageH - 11);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(8);
          doc.setTextColor(115, 125, 119);
          doc.text(`P'tits Dîners • Menus familiaux équilibrés (${state.season})`, m, pageH - 6.5);
          doc.text(`Page ${p} / ${totalPages}`, m + w, pageH - 6.5, { align: 'right' });
        }

        doc.save(`ptits-diners-${state.season.toLowerCase()}.pdf`);
        banner('PDF illustré généré et téléchargé.');
      }

      }

      function renderHistory() {
        const el = document.getElementById('tab-history');
        if (!el) return;
        el.innerHTML = `
          <div class="card">
            <h3 style="margin:0 0 8px;font-size:15px;">📋 Repas réalisés (${state.history.length})</h3>
            ${state.history.length === 0
              ? '<div class="muted">Aucun repas réalisé enregistré.</div>'
              : state.history.map(function (h) {
                  return `
                    <div class="list-row">
                      <div>
                        <strong>${h.title}</strong>
                        <div class="muted">${h.day} • ${h.date} ${h.x2 ? '• x2' : ''}</div>
                      </div>
                      <button type="button" class="btn btn-sm btn-danger" data-del-h="${h.id}">🗑️</button>
                    </div>
                  `;
                }).join('')}
          </div>
        `;
      }

      function render() {
        document.querySelectorAll('.season-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.season === state.season); });
        document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === state.tab); });
        document.querySelectorAll('.panel').forEach(function (p) { p.classList.toggle('active', p.id === 'tab-' + state.tab); });
        renderPlanning();
        renderRecipes();
        renderStock();
        renderHistory();
      }

      document.getElementById('themeBtn').addEventListener('click', function () {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        save();
      });

      document.querySelectorAll('.season-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          state.season = b.dataset.season;
          generateWeek(true);
        });
      });

      document.querySelectorAll('.nav-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          state.tab = b.dataset.tab;
          render();
        });
      });

      document.getElementById('closeModal').addEventListener('click', function () {
        document.getElementById('modal').classList.add('hidden');
      });

      document.body.addEventListener('click', function (e) {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.id === 'genBtn') {
          e.preventDefault();
          return generateWeek(true);
        }
        if (btn.id === 'pdfBtn') {
          e.preventDefault();
          return exportPdf();
        }
        if (btn.dataset.view) return openModal(btn.dataset.view);
        if (btn.dataset.cook !== undefined) return markCooked(Number(btn.dataset.cook));
        if (btn.dataset.undo !== undefined) {
          const idx = Number(btn.dataset.undo);
          return unmarkCooked(state.plan[idx] && state.plan[idx].hid, idx);
        }
        if (btn.dataset.delH) return unmarkCooked(btn.dataset.delH);
        if (btn.dataset.x2 !== undefined) {
          const i = Number(btn.dataset.x2);
          state.plan[i].x2 = !state.plan[i].x2;
          save();
          return render();
        }
        if (btn.dataset.swap !== undefined) {
          const i = Number(btn.dataset.swap);
          const previousIds = state.plan.map(function (p) { return p && p.recipeId; }).filter(Boolean);
          const virtualStock = state.stock.map(function (s) { return Object.assign({}, s); });
          const usedIds = new Set(state.plan.map(function (p, k) { return k === i ? null : p.recipeId; }).filter(Boolean));
          const pick = pickRecipeFor(i, state.plan[i].slotId || 'auto', virtualStock, usedIds, previousIds);
          state.plan[i].recipeId = pick.id;
          state.plan[i].cooked = false;
          state.plan[i].manual = false;
          save();
          return render();
        }
        if (btn.dataset.inc !== undefined) {
          const s = state.stock[Number(btn.dataset.inc)];
          s.qty += (s.unit === 'pièces' ? 1 : 50);
          save();
          return render();
        }
        if (btn.dataset.dec !== undefined) {
          const s = state.stock[Number(btn.dataset.dec)];
          s.qty = Math.max(0, s.qty - (s.unit === 'pièces' ? 1 : 50));
          save();
          return render();
        }
        if (btn.id === 'addIngBtn') {
          const name = (document.getElementById('ingName').value || '').trim();
          const qty = parseFloat(document.getElementById('ingQty').value);
          const unit = document.getElementById('ingUnit').value;
          if (!name || isNaN(qty) || qty <= 0) return banner('Saisissez un nom et une quantité valide.', true);
          const ex = state.stock.find(function (x) { return x.name.toLowerCase() === name.toLowerCase(); });
          if (ex) ex.qty = Math.round((ex.qty + qty) * 10) / 10;
          else state.stock.push({ name: name, qty: qty, unit: unit, cat: inferCat(name), urgent: false });
          save();
          render();
          banner(`${name} ajouté au stock.`);
        }
      });

      document.body.addEventListener('change', function (e) {
        const t = e.target;
        if (t.id === 'incPdf') {
          state.includeShoppingPdf = t.checked;
          save();
        }
        if (t.dataset.slot !== undefined) {
          const i = Number(t.dataset.slot);
          state.plan[i].slotId = t.value;
          // Si le repas n'a pas été choisi manuellement, on met à jour immédiatement selon la nouvelle durée
          if (!state.plan[i].manual) {
            const previousIds = state.plan.map(function (p) { return p && p.recipeId; }).filter(Boolean);
            const virtualStock = state.stock.map(function (s) { return Object.assign({}, s); });
            const usedIds = new Set(state.plan.map(function (p, k) { return k === i ? null : p.recipeId; }).filter(Boolean));
            const pick = pickRecipeFor(i, t.value, virtualStock, usedIds, previousIds);
            state.plan[i].recipeId = pick.id;
            state.plan[i].cooked = false;
          }
          save();
          render();
        }
        if (t.dataset.put && t.value !== '') {
          const dIdx = Number(t.value);
          if (!isNaN(dIdx) && state.plan[dIdx]) {
            state.plan[dIdx].recipeId = t.dataset.put;
            state.plan[dIdx].cooked = false;
            state.plan[dIdx].manual = true;
            save();
            render();
            banner(`Placé manuellement le ${DAYS[dIdx]} (conservé lors de « Générer »).`);
          }
        }
      });

      load();
      applyTheme();
      if (!state.plan || state.plan.length !== 7) generateWeek(true);
      else render();
    })();
  </script>
</body>
</html>
